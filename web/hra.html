<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central HRA</title>
<meta name="theme-color" content="#0f1f3d">
<link rel="icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
/* Central HRA web: same navy + gold as the desktop app. Header band, sidebar menu, page panels. */
:root {
  --navy: #0f1f3d; --navy2: #1b2f57; --navy3: #25406f; --gold: #e8c75c; --gold-d: #c9a227; --bg: #e9edf4; --card: #ffffff;
  --ink: #172338; --muted: #66748c; --line: #d6dce8; --red: #b8322a; --amber: #b5710b; --green: #1e7b3a; --edit: #ffe1ad;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.45 "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* sign-in + home */
.splash { min-height: 100%; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
  background: radial-gradient(900px 500px at 50% 110%, rgba(232,199,92,.16), transparent 60%), linear-gradient(160deg, #13284d, #08132a); color: #fff; text-align: center; }
.coin { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; font: 800 38px/1 "Segoe UI", sans-serif; color: var(--gold);
  background: radial-gradient(circle at 35% 30%, #243e6c, #0c1b38 70%); border: 6px solid var(--gold); box-shadow: 0 0 0 3px #7a6420 inset, 0 12px 40px rgba(0,0,0,.45); letter-spacing: -1px; }
.splash h1 { margin: 0; font-size: 34px; letter-spacing: 6px; color: var(--gold); }
.splash .sub { margin: 6px 0 26px; letter-spacing: 3px; font-size: 12px; color: #b7c3da; }
.splash p { color: #c9d3e6; max-width: 380px; margin: 0 auto 18px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 260px)); gap: 26px; justify-content: center; }
.tile { border: 1px solid #3c5584; border-radius: 16px; padding: 30px 16px; background: linear-gradient(180deg, #1d3561, #0f2142); color: #fff; cursor: pointer;
  box-shadow: 0 10px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12); transition: transform .12s, box-shadow .12s; }
.tile:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0,0,0,.45), 0 0 0 2px var(--gold) inset; }
.tile b { display: block; font-size: 24px; letter-spacing: 2px; color: var(--gold); margin: 6px 0; } .tile span { color: #c9d3e6; font-size: 13px; } .tile i { font-style: normal; font-size: 30px; }

/* buttons */
.btn { border: 0; border-radius: 9px; padding: 8px 15px; font-weight: 600; cursor: pointer; background: linear-gradient(180deg, #2a4677, var(--navy)); color: #fff;
  box-shadow: 0 2px 0 #08132a, inset 0 1px 0 rgba(255,255,255,.18); white-space: nowrap; }
.btn.gold { background: linear-gradient(180deg, #f6dc86, var(--gold-d)); color: #1d1600; box-shadow: 0 2px 0 #8d6f12, inset 0 1px 0 rgba(255,255,255,.5); }
.btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); box-shadow: 0 1px 0 var(--line); }
.btn.red { background: linear-gradient(180deg, #d55247, var(--red)); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .tile:focus-visible, .nav:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* app shell */
#app { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
header.band { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
  background: linear-gradient(180deg, #172d55, var(--navy)); color: #fff; border-bottom: 3px solid var(--gold-d); }
header.band .mini { width: 40px; height: 40px; border-width: 3px; font-size: 13px; margin: 0; box-shadow: none; flex: none; }
header.band h1 { margin: 0; font-size: 16px; letter-spacing: 3px; color: var(--gold); line-height: 1.1; }
header.band small { display: block; letter-spacing: 1px; color: #aebbd3; font-size: 11px; }
header.band .sp { flex: 1; }
header.band .who { color: #aebbd3; font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0; }
aside { background: linear-gradient(180deg, #13264a, #0b1730); color: #d4dcec; padding: 10px 8px 20px; }
aside .grp { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--gold); padding: 12px 10px 4px; }
.nav { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: 0; color: #d4dcec; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.nav:hover { background: rgba(255,255,255,.07); }
.nav.on { background: linear-gradient(90deg, rgba(232,199,92,.28), rgba(232,199,92,.05)); color: #fff; box-shadow: inset 3px 0 0 var(--gold); }
.nav em { font-style: normal; font-size: 10px; color: #8796b3; margin-left: auto; }
#page { padding: 16px max(16px, env(safe-area-inset-right)) 30px 16px; min-width: 0; }
footer.status { background: #0b1730; color: #aebbd3; font-size: 12px; padding: 4px 16px; }

/* panels */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(15,31,61,.06); overflow: hidden; min-width: 0; }
.panel > h2 { margin: 0; padding: 8px 14px; font-size: 12px; letter-spacing: 2px; color: var(--gold); background: linear-gradient(90deg, #0b1730, #1d3561); border-bottom: 2px solid var(--gold-d); text-transform: uppercase; }
.panel .body { padding: 12px 14px; }
.row-flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row-flex > input, .row-flex > select { flex: 1; min-width: 160px; }
input, select, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; min-width: 0; }
input.search { background: #fffbe9; border-color: #e6d28f; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; }
dl.kv { margin: 0; display: grid; grid-template-columns: minmax(140px, 36%) 1fr; gap: 6px 14px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; font-weight: 600; word-break: break-word; }
.photo { display: grid; place-items: center; min-height: 300px; color: var(--muted); }
.photo img { max-width: 100%; max-height: 360px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.hits { display: grid; gap: 4px; margin-top: 8px; max-height: 220px; overflow: auto; }
.hit { text-align: left; background: #f6f8fc; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.hit:hover { background: #fff6dc; }
.pill { font-size: 11px; font-weight: 700; border-radius: 20px; padding: 2px 8px; white-space: nowrap; }
.pill.ok { background: #e2f3e7; color: var(--green); } .pill.no { background: #f6e1de; color: var(--red); } .pill.warn { background: #fbefd9; color: var(--amber); }
.tbl-wrap { overflow: auto; max-height: 68vh; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; background: #1b2f57; color: #fff; text-align: left; padding: 6px 8px; font-weight: 600; white-space: nowrap; }
td { padding: 5px 8px; border-top: 1px solid #eef1f6; white-space: nowrap; }
tr:nth-child(even) td { background: #f8fafd; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: #fff6dc; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; }
.field { display: grid; grid-template-columns: minmax(120px, 42%) 1fr; gap: 8px; align-items: center; }
.field label { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.field input.changed { background: var(--edit); border: 2px solid #d97a00; font-weight: 600; }
.field input[readonly] { background: #f1f3f7; color: var(--muted); }
.bar { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px 0; background: var(--bg); }
.bar .info { margin-right: auto; color: var(--muted); }
.drop { border: 3px dashed #9aa8bf; border-radius: 14px; background: #f7f9fc; padding: 28px; text-align: center; cursor: pointer; }
.drop.hot { border-color: var(--gold-d); background: #fff7dd; }
.drop b { font-size: 19px; color: var(--navy); }
.change-item { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.change-item > .head { padding: 7px 10px; font-weight: 700; background: #f3f6fb; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.change-item > .head.err { color: var(--red); background: #fbefed; } .change-item > .head.new { color: var(--green); }
.change-item table td { white-space: normal; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.soon { text-align: center; padding: 50px 20px; color: var(--muted); }
.soon b { display: block; font-size: 18px; color: var(--navy); margin-bottom: 6px; }
.spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--navy); border-radius: 50%; animation: s 1s linear infinite; margin: 30px auto; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .tile { transition: none; } }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 30; max-width: 90vw; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.modal { position: fixed; inset: 0; background: rgba(8,19,42,.6); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal .box { background: #fff; border-radius: 14px; width: min(560px, 100%); max-height: 88vh; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.modal .box > h3 { margin: 0; padding: 12px 16px; background: linear-gradient(90deg, #0b1730, #1d3561); color: var(--gold); letter-spacing: 1px; font-size: 15px; }
.modal .box .body { padding: 14px 16px; } .modal ul { padding-left: 18px; } .modal li { margin-bottom: 4px; word-break: break-word; }
.modal .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 0 16px 16px; }
.code { font-size: 28px; letter-spacing: 12px; text-align: center; width: 100%; font-weight: 700; }
.msg-err { color: var(--red); font-weight: 600; } .msg-ok { color: var(--green); font-weight: 600; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat div { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; color: var(--navy); }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  aside { display: flex; gap: 4px; overflow-x: auto; padding: 6px; }
  aside .grp { display: none; } .nav { width: auto; white-space: nowrap; } .nav em { display: none; }
  .grid2, .fields { grid-template-columns: 1fr; }
  header.band .who { display: none; }
  .tiles { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- sign-in -->
<section class="splash" id="signin" hidden>
  <div>
    <div class="coin">HRA</div>
    <h1>CENTRAL HRA</h1>
    <div class="sub">AUTOMATION SYSTEM · WEB</div>
    <p id="signin-msg">Sign in with the Google account the HR database is shared with.</p>
    <button class="btn gold" id="signin-btn">Sign in with Google</button>
  </div>
</section>

<!-- home: HR or Admin -->
<section class="splash" id="home" hidden>
  <div>
    <div class="coin">HRA</div>
    <h1>CENTRAL HRA</h1>
    <div class="sub">AUTOMATION SYSTEM · SELECT A SYSTEM</div>
    <div class="tiles">
      <button class="tile" data-sys="hr"><i>👥</i><b>HR</b><span>HR Automation System</span></button>
      <button class="tile" data-sys="admin"><i>🏢</i><b>ADMIN</b><span>Office · Fleet · Accommodation</span></button>
    </div>
    <p class="small" style="margin-top:22px"><span id="home-who"></span> · <a href="#" id="home-out" style="color:var(--gold)">Sign out</a></p>
  </div>
</section>

<!-- app -->
<div id="app" hidden>
  <header class="band">
    <div class="coin mini">HRA</div>
    <h1 id="app-title">CENTRAL HRA AUTOMATION SYSTEM<small id="app-sub">Human Resources</small></h1>
    <span class="sp"></span>
    <button class="btn gold" id="ai-btn" title="Coming in a later phase" disabled>✦ Ask AI</button>
    <button class="btn ghost" id="home-btn">⌂ Home</button>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="out-btn">Sign out</button>
  </header>
  <div class="shell">
    <aside id="menu"></aside>
    <main id="page"></main>
  </div>
  <footer class="status" id="status"></footer>
</div>

<script>
/* ======================= settings (same Google Sheets and photo folder as the desktop app) ======================= */
const CLIENT_ID = '747046879263-64eg8pft9q16doupmm7nikf31a4p0c2b.apps.googleusercontent.com';   // public web client ID (not a secret)
const SHEET_ID = '1xpf_Sp1Uce9kpWTfVF9UBoRt6xNC89cUIkSdJaJbCb4';          // Masterock HR Database
const COMP_ID = '1q2APjy5ckHnumdkYoYj9jWX3CwGAZhkE_2za1AJG6Yk';           // Compensation (shared only with the salary group)
const PHOTOS_FOLDER = '1HQdtrapvKMQsRLoEdPtQYBylOeM-ekT0';
const TAB = 'Employee Database', ID = 'SL EMP ID';
const OWNER_EMAIL = 'ktan6689@gmail.com';                                 // passcodes only ever go here
const SCOPES = ['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive',
  'https://www.googleapis.com/auth/gmail.send', 'https://www.googleapis.com/auth/userinfo.email'].join(' ');
const COMP = ['BASIC SALARY (USD)', 'FIXED ALLOWANCE (USD)', 'TRAVEL ALLOWANCE (USD)', 'MEAL ALLOWANCE (USD)', 'TRANSPORTATION ALLOWANCE (USD)', 'HOUSING ALLOWANCE (USD)'];
const LOCKED = [ID, 'NO'];
const LOOKUP_FIELDS = [['Full name (passport order)', 'NAME AS IN PASSPORT'], ['SL Employee ID', ID], ['Company', 'COMPANY'], ['Expat / Local', 'EXPAT / LOCAL'],
  ['Active / Inactive', 'ACTIVE/ INACTIVE'], ['Nationality', 'NATIONALITY'], ['Passport No', 'PASSPORT NUMBER'], ['Passport expiry', 'DATE OF EXPIRY (MM/DD/YYYY)'],
  ['Visa status', 'VISA STATUS'], ['Residence visa no', 'RESIDENCE VISA NUMBER'], ['Visa expiry', 'MOST RECENT EXPIRY DATE'],
  ['Position', 'POSITION (PC /MR DESIGNATION)'], ['Department', 'DEPARTMENT (INTERNAL)'], ['Basic salary (USD)', 'BASIC SALARY (USD)']];
const TEAM_COLS = [['Emp ID', ID], ['Name', 'FULL NAME'], ['Department', 'DEPARTMENT (INTERNAL)'], ['Status', 'ACTIVE/ INACTIVE'], ['Company', 'COMPANY'],
  ['Visa expiry', 'MOST RECENT EXPIRY DATE'], ['Join (SL)', 'MROCK /REAL JOIN DATE (MM/DD/YY)'], ['Employment', 'EMPLOYMENT STATUS'], ['Designation', 'DESIGNATION (INTERNAL)']];

/* ======================= state + helpers ======================= */
let token = null, tokenClient = null, email = '', hdr = [], rows = [], canSeeComp = false, compHdr = [], photoIndex = null, photoCache = {};
let current = null, system = 'hr', pageKey = 'lookup';
const $ = s => document.querySelector(s);
const norm = s => String(s ?? '').replace(/\s+/g, ' ').trim().toUpperCase();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const text = v => { const s = String(v ?? '').trim(); return ['NONE', 'N/A'].includes(s.toUpperCase()) ? '' : s; };
const val = (r, k) => text(r && r[k]);
const title = h => h.charAt(0) + h.slice(1).toLowerCase();
function toast(t, ms = 2800) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
function status(t) { $('#status').textContent = t; }
const colLetter = n => { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const cellValue = v => { const s = String(v).trim(), c = s.replace(/,/g, ''); return /^-?(0|[1-9]\d*)(\.\d+)?$/.test(c) ? Number(c) : s; };   // numbers stay numbers, IDs keep text
function parseDate(s) { const m = String(s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (!m) return null; const d = new Date(+m[3], +m[2] - 1, +m[1]); return isNaN(d) ? null : d; }
const daysTo = d => Math.round((d - new Date(new Date().toDateString())) / 864e5);

function modal(titleText, bodyHtml, buttons) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${esc(titleText)}</h3><div class="body">${bodyHtml}</div><div class="foot"></div></div>`;
  const foot = m.querySelector('.foot');
  return new Promise(resolve => {
    buttons.forEach(([label, cls, value]) => { const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = label;
      b.onclick = () => { m.remove(); resolve(value); }; foot.appendChild(b); });
    document.body.appendChild(m); (foot.lastChild || {}).focus && foot.lastChild.focus();
  });
}

/* ======================= Google sign-in + API ======================= */
function initAuth() {
  if (!window.google || !google.accounts) return setTimeout(initAuth, 200);
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES,
    callback: async r => {
      signinBusy(false);
      if (r.error) { showSignin('Sign-in was cancelled. Try again.'); return; }
      token = r.access_token; try { sessionStorage.setItem('hraTok', JSON.stringify({ t: token, exp: Date.now() + (r.expires_in - 60) * 1000 })); } catch (e) {}
      await afterSignIn(); },
    // pop-up blocked / closed: say so instead of silently doing nothing (this made "Sign in" look dead)
    error_callback: e => { signinBusy(false);
      showSignin(e && e.type === 'popup_failed_to_open' ? 'The Google sign-in window was blocked. Allow pop-ups for this site, then click Sign in again.'
        : 'The Google sign-in window was closed before finishing. Click Sign in to try again.'); } });
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem('hraTok') || 'null'); } catch (e) {}
  if (saved && saved.exp > Date.now()) { token = saved.t; afterSignIn(); } else showSignin();
}
function screen(id) { ['signin', 'home', 'app'].forEach(s => $('#' + s).hidden = s !== id); }
function showSignin(msg) { screen('signin'); if (msg) $('#signin-msg').textContent = msg; }
function signinBusy(on) { const b = $('#signin-btn'); b.disabled = on; b.textContent = on ? 'Opening Google sign-in…' : 'Sign in with Google'; if (on) setTimeout(() => signinBusy(false), 20000); }
$('#signin-btn').onclick = () => {
  if (!tokenClient) { showSignin('Still loading Google sign-in… try again in a few seconds.'); return; }
  signinBusy(true);
  tokenClient.requestAccessToken({ prompt: 'select_account' });   // always show the account chooser, so signing in again after "Sign out" works
};
// sign out = forget the token here only; revoking the Google grant made the next sign-in fail / ask for consent again
function signOut() { try { sessionStorage.removeItem('hraTok'); sessionStorage.removeItem('hraPin'); } catch (e) {} token = null; email = ''; photoCache = {}; photoIndex = null; showSignin('Signed out.'); }
$('#out-btn').onclick = signOut; $('#home-out').onclick = e => { e.preventDefault(); signOut(); };

async function api(url, opts = {}) {
  const headers = { Authorization: 'Bearer ' + token, ...(opts.body && typeof opts.body === 'string' ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) };
  const r = await fetch(url, { ...opts, headers });
  if (r.status === 401) { token = null; try { sessionStorage.removeItem('hraTok'); } catch (e) {} showSignin('Your session ended. Please sign in again.'); throw new Error('signed out'); }
  if (!r.ok) { const e = new Error(r.status === 403 ? 'No access' : 'Google returned ' + r.status); e.status = r.status;
    try { e.detail = await r.text(); } catch (x) { e.detail = ''; } throw e; }
  return r;
}
const sheetUrl = (id, range) => `https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(range)}`;

async function afterSignIn() {
  screen('home'); $('#home-who').textContent = 'Loading…';
  try {
    try { const u = await (await api('https://www.googleapis.com/oauth2/v3/userinfo')).json(); email = u.email || ''; } catch (e) { if (e.message === 'signed out') return; }
    // second step: 4-digit PIN emailed to Kevin (once per sign-in; a page refresh in the same session doesn't ask again)
    let pinOk = false;
    try { const p = JSON.parse(sessionStorage.getItem('hraPin') || 'null'); pinOk = !!(p && p.t === token.slice(-16) && p.exp > Date.now()); } catch (e) {}
    if (!pinOk) {
      $('#home-who').textContent = 'Waiting for the sign-in PIN…';
      const ok = await ensurePasscode('sign in to Central HRA', false);
      if (!ok) { signOut(); showSignin('Sign-in needs the PIN sent to ' + OWNER_EMAIL + '.'); return; }
      let exp = Date.now() + 3600e3; try { exp = JSON.parse(sessionStorage.getItem('hraTok')).exp; } catch (e) {}
      try { sessionStorage.setItem('hraPin', JSON.stringify({ t: token.slice(-16), exp })); } catch (e) {}
      $('#home-who').textContent = 'Loading…';
    }
    await loadData();
    $('#home-who').textContent = `${email || 'Signed in'} · ${rows.length} employees`;
  } catch (e) {
    if (e.message === 'signed out') return;
    showSignin(e.status === 403 ? 'This Google account has no access to the HR database. Ask Kevin to share it with you.' : 'Could not load the HR database: ' + e.message);
  }
}

async function loadData() {
  const [main, comp] = await Promise.all([
    api(sheetUrl(SHEET_ID, `'${TAB}'`)).then(r => r.json()),
    api(sheetUrl(COMP_ID, 'A:ZZ')).then(r => r.json()).catch(e => { if (e.message === 'signed out') throw e; return null; })   // only the salary group can read it
  ]);
  const v = main.values || []; hdr = (v[0] || []).map(norm);
  rows = v.slice(1).map((r, i) => { const o = { _row: i + 2 }; hdr.forEach((h, j) => { if (h) o[h] = r[j] ?? ''; }); return o; }).filter(o => val(o, ID));
  canSeeComp = !!(comp && comp.values && comp.values.length);
  compHdr = canSeeComp ? comp.values[0].map(norm) : [];
  if (canSeeComp) {
    const byId = {}; comp.values.slice(1).forEach((r, i) => { if (r[0]) byId[norm(r[0])] = { r, row: i + 2 }; });
    rows.forEach(o => { const c = byId[norm(o[ID])]; if (c) compHdr.forEach((h, j) => { if (h && h !== ID) o[h] = c.r[j] ?? ''; }); });
  }
  status(`${rows.length} employees loaded${canSeeComp ? ' · salary access' : ''}`);
}
function findRows(q) {
  q = norm(q); if (!q) return [];
  const exact = rows.filter(r => [r[ID], r['MROCK EMP ID'], r['PCL EMP ID']].some(x => norm(x) === q)); if (exact.length) return exact;
  const words = q.replace(/,/g, ' ').split(' ').filter(Boolean);
  return rows.filter(r => { const hay = norm([r['FULL NAME'], r['NICKNAME'], r['NAME AS IN PASSPORT'], r['FIRST NAME'], r['LAST NAME / SURNAME']].join(' ')); return words.every(w => hay.includes(w)); });
}
const byId = id => rows.find(r => norm(r[ID]) === norm(id));

async function photoIndexLoad() {
  if (photoIndex) return photoIndex; photoIndex = {}; let pt = '';

    (r.files || []).forEach(f => photoIndex[f.name.replace(/\.[^.]+$/, '').toUpperCase()] = f.id); pt = r.nextPageToken || ''; } while (pt);

}
async function photoUrl(id) {

/* write changes: main sheet (row re-checked first) + compensation sheet */
async function updateEmployee(r, changes) {
  const main = Object.entries(changes).filter(([h]) => !COMP.includes(h)), comp = Object.entries(changes).filter(([h]) => COMP.includes(h));
  if (main.length) {
    const chk = await (await api(sheetUrl(SHEET_ID, `'${TAB}'!${colLetter(hdr.indexOf(ID))}${r._row}`))).json();
    if (norm(((chk.values || [[]])[0] || [])[0]) !== norm(r[ID])) { await loadData(); throw new Error('The sheet changed while you were editing. Open the employee again and retry.'); }
    const data = main.map(([h, v]) => ({ range: `'${TAB}'!${colLetter(hdr.indexOf(h))}${r._row}`, values: [[v === '' ? '' : cellValue(v)]] }));
    await api(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values:batchUpdate`, { method: 'POST', body: JSON.stringify({ valueInputOption: 'RAW', data }) });
  }
  if (comp.length) {
    if (!canSeeComp) throw new Error('You do not have access to compensation data.');
    const cv = (await (await api(sheetUrl(COMP_ID, 'A:ZZ'))).json()).values || [], ch = cv[0].map(norm);
    let crow = cv.findIndex((x, i) => i > 0 && x[0] && norm(x[0]) === norm(r[ID])) + 1;
    if (crow <= 0) { await api(sheetUrl(COMP_ID, 'A1') + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', { method: 'POST', body: JSON.stringify({ values: [[r[ID]]] }) }); crow = cv.length + 1; }
    const data = comp.map(([h, v]) => ({ range: `${colLetter(ch.indexOf(h))}${crow}`, values: [[v === '' ? '' : cellValue(v)]] }));
    await api(`https://sheets.googleapis.com/v4/spreadsheets/${COMP_ID}/values:batchUpdate`, { method: 'POST', body: JSON.stringify({ valueInputOption: 'RAW', data }) });
  }
  Object.assign(r, changes);
}
async function addEmployee(rec) {
  if (byId(rec[ID])) throw new Error(`${rec[ID]} already exists`);
  const main = Object.fromEntries(Object.entries(rec).filter(([h]) => !COMP.includes(h)));
  if (hdr.includes('NO') && !main.NO) { const nums = rows.map(r => parseInt(r.NO, 10)).filter(n => !isNaN(n)); main.NO = nums.length ? Math.max(...nums) + 1 : rows.length + 1; }
  await api(sheetUrl(SHEET_ID, `'${TAB}'!A1`) + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',
    { method: 'POST', body: JSON.stringify({ values: [hdr.map(h => main[h] === undefined || main[h] === '' ? '' : cellValue(main[h]))] }) });
  const comp = Object.entries(rec).filter(([h]) => COMP.includes(h));
  if (comp.length) {
    if (!canSeeComp) throw new Error('You do not have access to compensation data.');
    await api(sheetUrl(COMP_ID, 'A1') + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',
      { method: 'POST', body: JSON.stringify({ values: [compHdr.map(h => h === ID ? rec[ID] : (rec[h] !== undefined ? cellValue(rec[h]) : ''))] }) });
  }
  await loadData();
}

/* ======================= passcode for salary changes (emailed to Kevin only) ======================= */
let unlockedUntil = 0, codeState = null;
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
const b64url = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function sendCode(what) {
  const code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 10000).padStart(4, '0'), salt = crypto.getRandomValues(new Uint32Array(2)).join('-');
  const body = `Hi Kevin,\n\nPasscode for Central HRA: ${code}\n\nRequested at ${new Date().toLocaleString()} by ${email || 'a signed-in user'} (web app) to ${what}.\n` +
    `It works for 10 minutes and can only be used once.\nIf you did not expect this, someone is trying to ${what} - do not share the code.\n\n- Central HRA`;
  const raw = b64url(`To: ${OWNER_EMAIL}\r\nSubject: Central HRA passcode: ${code}\r\nContent-Type: text/plain; charset="UTF-8"\r\n\r\n${body}`);
  await api('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', { method: 'POST', body: JSON.stringify({ raw }) });
  codeState = { salt, hash: await sha(salt + code), exp: Date.now() + 10 * 60e3, tries: 0 };
}
async function checkCode(code) {
  if (!codeState) return [false, 'No passcode yet - click "Send a new code".'];
  if (Date.now() > codeState.exp) { codeState = null; return [false, 'The passcode has expired - click "Send a new code".']; }
  if (await sha(codeState.salt + code) === codeState.hash) { codeState = null; return [true, '']; }
  const left = 3 - ++codeState.tries; if (left <= 0) { codeState = null; return [false, 'Wrong passcode too many times - click "Send a new code".']; }
  return [false, `Wrong passcode - ${left} ${left === 1 ? 'try' : 'tries'} left.`];
}
function gmailProblem(e) {
  const d = e.detail || '';
  if (/SERVICE_DISABLED|accessNotConfigured|has not been used|is disabled/i.test(d))
    return 'the Gmail API is switched off in the Google Cloud project. Kevin: open console.cloud.google.com/apis/library/gmail.googleapis.com?project=masterock-hr-514313 and click Enable, wait 2 minutes, then click "Send a new code".';
  if (/SCOPE_INSUFFICIENT|insufficient/i.test(d))
    return 'permission to send email was not given at sign-in. Click "Give Gmail permission" and tick the Gmail box on the Google screen.';
  if (e.status === 403) return 'Google refused (' + (d.match(/"message":\s*"([^"]+)"/) || [, '403'])[1] + ').';
  return e.message;
}
function ensurePasscode(what, unlock = true) {
  if (unlock && Date.now() < unlockedUntil) return Promise.resolve(true);
  return new Promise(resolve => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${unlock ? 'Passcode required' : 'Sign-in PIN'}</h3><div class="body">
      <p>To ${esc(what)}, enter the 4-digit passcode sent to ${esc(OWNER_EMAIL)}.</p><input class="code" id="pc" inputmode="numeric" maxlength="4" autocomplete="one-time-code" aria-label="Passcode">
      <p id="pcmsg" class="small"></p></div><div class="foot"><button class="btn ghost" id="pcsend" style="margin-right:auto">Send a new code</button><button class="btn ghost" id="pcno">Cancel</button><button class="btn gold" id="pcok">Unlock</button></div></div>`;
    document.body.appendChild(m);
    const say = (t, bad) => { const p = m.querySelector('#pcmsg'); p.textContent = t; p.className = 'small ' + (bad ? 'msg-err' : 'msg-ok'); };
    const send = async () => { const b = m.querySelector('#pcsend'); b.disabled = true; say('Sending a passcode…');
      try { await sendCode(what); say(`Passcode sent to ${OWNER_EMAIL}. It works for 10 minutes.`); }
      catch (e) { say('Could not send the passcode: ' + gmailProblem(e), true);
        if (/SCOPE_INSUFFICIENT|insufficient/i.test(e.detail || '')) {        // Gmail box was not ticked at sign-in: ask Google again
          const again = document.createElement('button'); again.className = 'btn gold'; again.textContent = 'Give Gmail permission';
          again.onclick = () => { m.remove(); resolve(false); try { sessionStorage.removeItem('hraTok'); } catch (x) {} tokenClient.requestAccessToken({ prompt: 'consent' }); };
          m.querySelector('.foot').prepend(again);
        } }
      setTimeout(() => b.disabled = false, 15000); m.querySelector('#pc').focus(); };
    const done = ok => { m.remove(); if (ok && unlock) unlockedUntil = Date.now() + 10 * 60e3; resolve(ok); };
    const tryIt = async () => { const v = m.querySelector('#pc').value.trim(); if (!/^\d{4}$/.test(v)) return say('Enter all 4 digits.', true);
      const [ok, msg] = await checkCode(v); if (ok) done(true); else { m.querySelector('#pc').value = ''; say(msg, true); } };
    m.querySelector('#pcsend').onclick = send; m.querySelector('#pcno').onclick = () => done(false); m.querySelector('#pcok').onclick = tryIt;
    m.querySelector('#pc').oninput = e => { if (e.target.value.length === 4) tryIt(); };
    send();
  });
}

const SKIP_VALUES = new Set(['', 'N/A', 'NA', '-', '--', 'NONE', 'NIL']);

function makeMatcher() {

function readExcel(buf, match) {

    if (!rws.length) continue;

    for (let hi = 0; hi < Math.min(10, rws.length) && !tableDone; hi++) {             // (1) table: header row of DB columns incl. SL EMP ID
      const cols = rws[hi].map(h => typeof h === 'string' ? match(h) : null);
      if (cols.includes(ID) && cols.filter(Boolean).length >= 3) {
        rws.slice(hi + 1).forEach(r => { const rec = {}; cols.forEach((c, i) => { if (c && i < r.length) { const v = cleanValue(c, r[i]); if (v) rec[c] = v; } }); if (rec[ID]) recs.push(rec); });

async function analyse(files) {
  const match = makeMatcher(), out = [];
  for (const f of files) {
    const fn = f.name, ext = (fn.match(/\.[^.]+$/) || [''])[0].toLowerCase(), fid = idFrom(fn);
    try {
      if (['.jpg', '.jpeg', '.png'].includes(ext)) {
        if (!fid) { out.push({ file: fn, kind: 'error', msg: 'Photo file name must contain the employee ID, e.g. SL-1234.jpg' }); continue; }
        const r = byId(fid); if (!r) { out.push({ file: fn, kind: 'error', emp: fid, msg: `${fid} is not in the database yet - add the employee first` }); continue; }
        out.push({ file: fn, kind: 'photo', emp: fid, name: val(r, 'FULL NAME'), blob: f }); continue;
      }
      let recs;
      if (['.xlsx', '.xlsm'].includes(ext)) recs = readExcel(new Uint8Array(await f.arrayBuffer()), match);
      else if (ext === '.docx') recs = await readDocx(await f.arrayBuffer(), match);
      else if (['.doc', '.xls'].includes(ext)) { out.push({ file: fn, kind: 'error', emp: fid, msg: 'Old Office format - open it and save as .docx / .xlsx first' }); continue; }
      else { out.push({ file: fn, kind: 'error', emp: fid, msg: 'Not a picture, Excel or Word file' }); continue; }
      if (!recs.length) { out.push({ file: fn, kind: 'error', emp: fid, msg: 'No employee information found in this file' }); continue; }
      for (const rec of recs) {
        const emp = rec[ID] || fid;
        if (!emp) { out.push({ file: fn, kind: 'error', msg: 'No employee ID in the file name or the file' }); continue; }
        if (fid && rec[ID] && norm(rec[ID]) !== norm(fid) && recs.length === 1) { out.push({ file: fn, kind: 'error', emp: fid, msg: `File name says ${fid} but the file says ${rec[ID]} - check which is right` }); continue; }
        rec[ID] = emp;
        const cur = byId(emp), allowed = {}, skipped = [];
        Object.entries(rec).forEach(([c, v]) => (canSeeComp || !COMP.includes(c)) ? allowed[c] = v : skipped.push(c));
        if (!cur) { out.push({ file: fn, kind: 'new', emp, name: allowed['FULL NAME'] || '', changes: Object.entries(allowed).map(([c, v]) => [c, '', v]), skipped, record: allowed }); continue; }
        const ch = [];
        Object.entries(allowed).forEach(([c, v]) => {
          const old = val(cur, c); if (c === ID || old.toUpperCase() === v.toUpperCase()) return;
          if (old && old === old.toUpperCase() && /[A-Za-z]/.test(old) && !c.includes('EMAIL')) v = v.toUpperCase();     // follow the database's capitals
          ch.push([c, old, v]);

      }

}
async function preparePhoto(file) {        // JPEG, upright, max 1200 px
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }), s = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);

}
async function uploadPhoto(emp, jpeg) {
  const q = `'${PHOTOS_FOLDER}' in parents and trashed=false and name contains '${emp}'`;
  const found = ((await (await api(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`)).json()).files || [])
    .filter(f => f.name.replace(/\.[^.]+$/, '').toUpperCase() === emp.toUpperCase());
  try {
    if (found.length) await api(`https://www.googleapis.com/upload/drive/v3/files/${found[0].id}?uploadType=media`, { method: 'PATCH', body: jpeg, headers: { 'Content-Type': 'image/jpeg' } });
    else {
      const meta = JSON.stringify({ name: `${emp}.jpg`, parents: [PHOTOS_FOLDER] });
      const body = new Blob([`--b\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--b\r\nContent-Type: image/jpeg\r\n\r\n`, jpeg, '\r\n--b--']);
      await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', { method: 'POST', body, headers: { 'Content-Type': 'multipart/related; boundary=b' } });
    }
  } catch (e) { if (e.status === 403) throw new Error("No permission to change photos in the shared Drive folder - ask Kevin for edit access to 'Masterock HR Photos'."); throw e; }
  photoIndex = null; delete photoCache[emp];
}

async function runReport(btn, label, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { await loadReports(); await fn(); } catch (e) { console.error(e); if (e.message !== 'signed out') modal('Something went wrong', esc(e.message), [['OK', 'gold', 1]]); }
  finally { btn.disabled = false; btn.textContent = old; status(''); }
}

function pageCpcec() {
  $('#page').innerHTML = `<div class="panel"><h2>CPCEC Report <span class="muted small">(MROCK expats - business visa holders excluded)</span></h2><div class="body">
    <div class="row-flex"><input class="search" id="cq" placeholder="Search name, passport, visa no …" style="flex:1 1 240px">
      <select id="cst" style="flex:0 0 170px"><option>All</option><option>Active</option><option>Pending arrival</option><option>Cancelled</option></select>
      <button class="btn ghost" id="crel">Reload</button><button class="btn gold" id="cxl">Generate CPCEC Report (Excel)</button><button class="btn ghost" id="csync">Sync with Employee Database</button></div>
    <p class="small muted" id="ccount">Loading…</p>
    <p class="small muted"><span style="background:#CFE2F3;color:#123;padding:1px 6px;border-radius:3px">Blue</span> = resigned / cancelled · <span style="background:#FCE4D6;color:#321;padding:1px 6px;border-radius:3px">Peach</span> = pending arrival · no colour = active</p></div></div>
    <div class="panel"><div class="body" style="overflow:auto;max-height:70vh" id="ctab"></div></div>`;
  let hdr = [], data = [];
  const show = () => {
    const q = norm($('#cq').value), st = $('#cst').value;
    const list = data.filter(r => (!q || norm(r.join(' ')).includes(q)) && (st === 'All' || HRAReports.cpcecStatus(r) === st));
    const n = Math.max(hdr.length, ...list.map(r => r.length), 0);
    $('#ctab').innerHTML = `<table class="tbl"><thead><tr>${Array.from({ length: n }, (_, j) => `<th>${esc(hdr[j] || '')}</th>`).join('')}</tr></thead><tbody>` +
      list.map(r => { const s = HRAReports.cpcecStatus(r), bg = s === 'Cancelled' ? '#CFE2F3' : s === 'Pending arrival' ? '#FCE4D6' : '';
        return `<tr${bg ? ` style="background:${bg};color:#1b1b1b"` : ''}>${Array.from({ length: n }, (_, j) => `<td>${esc(text(r[j]))}</td>`).join('')}</tr>`; }).join('') + '</tbody></table>';
    $('#ccount').textContent = `${list.length} of ${data.length} row(s)`;
  };
  const load = () => runReport($('#crel'), 'Loading…', async () => {
    const vals = await tabValues('CPCEC Report');
    hdr = (vals[2] || []).map(h => String(h).trim()); data = vals.slice(3).filter(r => r.some(x => String(x ?? '').trim())); show();
  });
  $('#cq').oninput = show; $('#cst').onchange = show; $('#crel').onclick = load;
  $('#cxl').onclick = () => runReport($('#cxl'), 'Creating…', async () => {
    const vals = await tabValues('CPCEC Report'), res = await HRAReports.cpcecExcel(vals);
    const d = new Date(), name = `CPCEC Report ${d.getDate()} ${d.toLocaleString('en-GB', { month: 'long' })} ${d.getFullYear()}.xlsx`;
    saveBytes(name, res.bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); toast(`Saved ${name} (${res.rows} rows)`);
  });
  $('#csync').onclick = () => runReport($('#csync'), 'Checking…', async () => {
    await loadData(); const vals = await tabValues('CPCEC Report');
    const { updates, newRows, log } = HRAReports.cpcecPlan(vals, rows);
    if (!log.length) { await modal('CPCEC', 'The CPCEC report is already up to date.', [['OK', 'gold', 1]]); return; }
    const ok = await modal('CPCEC sync', `<p>These changes will be written to the CPCEC Report:</p><pre style="white-space:pre-wrap;max-height:50vh;overflow:auto;font-size:12px">${esc(log.slice(0, 60).join('\n'))}${log.length > 60 ? '\n…' : ''}</pre>`,
      [['Cancel', 'ghost', 0], [`Save ${log.length} change(s)`, 'gold', 1]]);
    if (!ok) return;
    await writeTabCells('CPCEC Report', updates); await appendTabRows('CPCEC Report', newRows);
    toast(`CPCEC report: ${log.length} change(s) saved`); load();
  });
  load();
}

function pageDashboard() {
  $('#page').innerHTML = `<div class="panel"><h2>HR Dashboard</h2><div class="body">
    <p>Everything on the dashboard comes from the Employee Database automatically, except the numbers below (Manila figures, attendance, government contributions). Update them, click Save, then Generate.</p>
    <div class="row-flex" style="justify-content:flex-end"><button class="btn ghost" id="dsave">Save numbers</button><button class="btn gold" id="dgo">Generate dashboard</button></div>
    <div id="dres" class="small"></div></div></div>
    <div class="panel"><div class="body" style="overflow:auto" id="dtab">Loading…</div></div>`;
  let vals = [], keys = [];
  const load = () => runReport(document.createElement('button'), '', async () => {      // own throw-away button: doesn't clash with Save's label
    vals = await tabValues('Dashboard Inputs');
    const width = Math.max(0, ...vals.map(r => r.length)); vals = vals.map(r => r.concat(new Array(width - r.length).fill('')));
    keys = vals.map((r, i) => [i + 1, r]).filter(([, r]) => r.length > 2 && HRAReports.isUpperKey(String(r[0]).trim()) && String(r[0]).trim() !== 'KEY');
    $('#dtab').innerHTML = `<table class="tbl"><thead><tr><th>Item</th><th>Value</th><th>Notes</th></tr></thead><tbody>` +
      keys.map(([rn, r], i) => `<tr><td>${esc(text(r[1]))}</td><td><input data-i="${i}" value="${esc(text(r[2]))}" style="width:110px"></td><td class="muted">${esc(text(r[3] ?? ''))}</td></tr>`).join('') + '</tbody></table>';
  });
  $('#dsave').onclick = () => runReport($('#dsave'), 'Saving…', async () => {
    const cells = [];
    document.querySelectorAll('#dtab input').forEach(inp => { const [rn, r] = keys[+inp.dataset.i], v = inp.value.trim(); if (v !== text(r[2])) cells.push([rn, 3, v]); });
    if (!cells.length) { toast('No numbers were changed.'); return; }
    await writeTabCells('Dashboard Inputs', cells); toast(`Saved ${cells.length} dashboard number(s)`); load();
  });
  $('#dgo').onclick = () => runReport($('#dgo'), 'Creating…', async () => {
    await loadData(); const inp = await tabValues('Dashboard Inputs');
    const res = await HRAReports.dashboard(rows, inp), s = res.summary;
    const url = URL.createObjectURL(new Blob([res.html], { type: 'text/html' }));
    $('#dres').innerHTML = `<p class="msg-ok">Dashboard created: Sri Lanka ${s.SL} (MR ${s.MR}, PC ${s.PC}), Manila ${s.MNL}${res.warn.length ? ` · ${res.warn.length} template warning(s)` : ''}</p>
      <div class="row-flex"><a class="btn gold" href="${url}" target="_blank" rel="noopener">Open dashboard</a><a class="btn ghost" href="${url}" download="${esc(res.name)}">Download (${esc(res.name)})</a></div>`;
  });
  load();
}

function saveBytes(name, bytes, type = 'application/pdf') {
  const url = URL.createObjectURL(new Blob([bytes], { type })), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function busyRun(btn, label, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { await loadForms(); await fn(); } catch (e) { console.error(e); if (e.message !== 'signed out') modal('Something went wrong', esc(e.message), [['OK', 'gold', 1]]); }
  finally { btn.disabled = false; btn.textContent = old; status(''); }
}
/* employee picker used by every form page */
function picker(el, onPick, button = 'Find') {
  el.innerHTML = `<div class="row-flex"><input class="search" placeholder="Employee ID (SL-1234, M0123) or name" autocomplete="off"><button class="btn gold">${esc(button)}</button>
    <button class="btn ghost">Use employee from Lookup</button></div><div class="small msg-err"></div><div class="hits"></div>`;
  const [q] = el.querySelectorAll('input'), [find, cur] = el.querySelectorAll('button'), msg = el.querySelector('.msg-err'), hits = el.querySelector('.hits');
  const run = () => { const r = findRows(q.value); hits.innerHTML = ''; msg.textContent = '';
    if (!r.length) { msg.textContent = 'No employee found.'; return; }
    if (r.length === 1) return onPick(r[0]);
    hits.innerHTML = r.slice(0, 50).map(x => `<button class="hit" data-id="${esc(x[ID])}">${esc(x[ID])}  ·  ${esc(val(x, 'FULL NAME'))}  (${esc(val(x, 'ACTIVE/ INACTIVE'))})</button>`).join('');
    hits.querySelectorAll('.hit').forEach(b => b.onclick = () => { hits.innerHTML = ''; onPick(byId(b.dataset.id)); }); };
  find.onclick = run; q.onkeydown = e => { if (e.key === 'Enter') run(); };
  cur.onclick = () => current ? onPick(current) : (msg.textContent = 'Pick an employee in Employee Lookup first.');
}
const whoLine = r => `${r[ID]}  ${val(r, 'FULL NAME')}  ·  ${val(r, 'COMPANY')}  ·  ${val(r, 'EXPAT / LOCAL')}`;
function formPage(titleText, optionsHtml, buttonsHtml, onLoad) {
  $('#page').innerHTML = `<div class="panel"><h2>${esc(titleText)}</h2><div class="body"><div id="pick"></div><b id="who" style="display:block;margin-top:8px;font-size:15px">No employee selected</b></div></div>
    ${optionsHtml}<div class="bar"><span class="info" id="finfo"></span>${buttonsHtml}</div>`;
  let row = null;
  const load = r => { row = r; current = r; $('#who').textContent = whoLine(r); document.querySelectorAll('.bar .btn').forEach(b => b.disabled = false); onLoad && onLoad(r); };
  picker($('#pick'), load); document.querySelectorAll('.bar .btn').forEach(b => b.disabled = true);
  if (current) load(current);
  return () => row;
}
const INFO_COMPANIES = ['Masterock', 'Whiterain', 'Imperium', 'Blueline', 'Netease', 'Nexzen'];
function infoCompanyFor(c) { c = norm(c); for (const n of INFO_COMPANIES) if (c.includes(n.toUpperCase()) || (n === 'Masterock' && ['MROCK', 'MR'].includes(c))) return n; return 'Masterock'; }

function pageInfoForm() {
  const row = formPage('Employee Information Form',
    `<div class="panel"><h2>Form options</h2><div class="body"><div class="row-flex"><label class="muted" for="icomp">Company</label>
      <select id="icomp" style="flex:0 1 260px">${INFO_COMPANIES.map(c => `<option>${c}</option>`).join('')}</select></div>
      <p class="small muted">Printed at the top of the form and in the declaration. It is set from the employee's company - change it if needed. The PDF keeps a Company drop-down, so it can still be changed when the form is opened.</p></div></div>
     <div class="panel"><h2>What gets filled in</h2><div class="body small muted">Name (first / middle / last), English name, date and place of birth, home and Sri Lanka addresses, gender and marital status ticks, contact number, e-mail, nationality, passport details, emergency contact name and number.<br><br>Left blank for the employee (not in the database): religion, emergency contact relationship / address / e-mail, other number, health declaration, signature and date.</div></div>`,
    `<button class="btn gold" id="go">Create information form (PDF)</button>`, r => $('#icomp').value = infoCompanyFor(r.COMPANY));
  $('#go').onclick = () => busyRun($('#go'), 'Creating…', async () => {
    const res = await HRAForms.fill(row(), ['MR_INFO'], $('#icomp').value);
    if (res.errs.length) throw new Error(res.errs.join('\n'));

  });
}

           $('#vnote').textContent = norm(r['EXPAT / LOCAL']) === 'LOCAL' ? 'This employee is LOCAL - the residence visa form is normally for expats only.' : ''; });
  $('#go').onclick = () => busyRun($('#go'), 'Creating…', async () => { const res = await HRAForms.residenceVisa(row(), $('#vcat').value); saveBytes(res.name, res.bytes); toast('Saved ' + res.name); });
}
let epfValues = null;
async function getEpfValues() { if (!epfValues) epfValues = (await (await api(sheetUrl(SHEET_ID, "'EPF ETF Data'"))).json()).values || []; return epfValues; }
function pageEpf() {
  const row = formPage('EPF / ETF Claims (Form K and Form VI)', `<div class="panel"><h2>Contributions on file</h2><div class="body" id="einfo">Pick an employee.</div></div>`,
    `<button class="btn gold" id="gk">EPF claim - Form K (PDF)</button><button class="btn gold" id="gv">ETF claim - Form VI (PDF)</button>`,
    async r => {
      $('#einfo').textContent = 'Loading contributions…';
      try { await loadForms(); const f = HRAForms.epfFacts(r, await getEpfValues()), ym = k => `${Math.floor(k / 100)}/${String(k % 100).padStart(2, '0')}`;
        const ep = Object.keys(f.epf).map(Number).sort((a, b) => a - b), et = Object.keys(f.etf).map(Number).sort((a, b) => a - b), dmy_ = d => d ? `${String(d.d).padStart(2, '0')}/${String(d.m).padStart(2, '0')}/${d.y}` : '';
        $('#einfo').innerHTML = [`<b>${esc(f.emp_id)}  ${esc(f.full)}</b>`, `EPF / ETF member no: <b>${esc(f.member || '-')}</b>`,
          ...(f.member ? [`EPF C-Form months on file: <b>${ep.length}</b>${ep.length ? ` (${ym(ep[0])} - ${ym(ep[ep.length - 1])})` : ''}`,
                          `ETF return months on file: <b>${et.length}</b>${et.length ? ` (${ym(et[0])} - ${ym(et[et.length - 1])})` : ''}`,
                          `Name in EPF records: ${esc(f.epf_name || '-')}  ·  ETF: ${esc(f.etf_name || '-')}`]
                       : ['<span class="msg-err">No EPF MEMBER NO in the database - add it on Employee Update first.</span>']),
          `Join: ${dmy_(f.join) || '-'}  ·  End: ${dmy_(f.end) || (f.active ? 'still active' : '-')}  ·  Reason: ${esc(f.reason || '-')}`,
          `Bank: ${esc(f.bank || '-')}  ·  Account: ${esc(f.acc || '-')}  ·  Branch: ${esc(f.branch || '-')}`].join('<br>');
      } catch (e) { $('#einfo').textContent = 'Could not read the EPF ETF Data tab: ' + e.message; }
    });
  const make = (which, btn) => busyRun(btn, 'Creating…', async () => { const res = await HRAForms.claim(which, row(), await getEpfValues()); saveBytes(res.name, res.bytes); toast('Saved ' + res.name); });
  $('#gk').onclick = () => make('K', $('#gk')); $('#gv').onclick = () => make('VI', $('#gv'));
}
function pageCoe() {

        <h3 style="text-align:center">CERTIFICATE OF EMPLOYMENT</h3><p><b>TO WHOM IT MAY CONCERN:</b></p>${paras.map(p => `<p>${esc(p)}</p>`).join('')}`;

let photoPeople = [];
function pageIdPhotos() {
  $('#page').innerHTML = `<div class="panel"><h2>ID Photos (35 x 45 mm, 4 copies each)</h2><div class="body"><div id="pick"></div></div></div>
    <div class="panel"><h2>Employees on this sheet</h2><div class="body"><div id="plist" class="hits" style="max-height:none"></div>
      <div class="row-flex" style="margin-top:8px"><button class="btn ghost" id="pclear">Clear</button></div></div></div>

  const render = () => { $('#plist').innerHTML = photoPeople.length ? photoPeople.map((p, i) => `<div class="hit" style="display:flex;justify-content:space-between;cursor:default">${esc(p[0])}  ${esc(p[1])}<button class="btn ghost" data-rm="${i}" style="padding:2px 10px">Remove</button></div>`).join('') : '<div class="muted">Add employees with the search above.</div>';
    $('#plist').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { photoPeople.splice(+b.dataset.rm, 1); render(); }); };
  picker($('#pick'), r => { if (!photoPeople.some(p => p[0] === r[ID])) photoPeople.push([r[ID], val(r, 'NAME AS IN PASSPORT') || val(r, 'FULL NAME').replace(/,/g, '')]); render(); }, 'Add');
  $('#pclear').onclick = () => { photoPeople = []; render(); };

      saveBytes(res.name, res.bytes); toast('Saved ' + res.name + (res.missing.length ? ' - no photo on file for: ' + res.missing.join(', ') : ''), 5000); }); };

}
function pagePcForms() {

    `<button class="btn gold" id="go">Fill selected forms</button>`);
  $('#go').onclick = () => { const keys = [...document.querySelectorAll('[data-k]:checked')].map(c => c.dataset.k); if (!keys.length) return toast('Tick at least one form.');
    busyRun($('#go'), 'Filling…', async () => {
      const res = await HRAForms.fill(row(), keys);
      if (!res.files.length) throw new Error(['No forms were filled.', ...res.notes, ...res.errs].join('\n'));

      saveBytes(`${res.folder} - PC Forms.zip`, await zip.generateAsync({ type: 'uint8array' }), 'application/zip');
      modal('PC forms filled', `${res.files.length} form(s) filled and downloaded as one ZIP file.` + res.notes.map(n => `<br>${esc(n)}`).join('') + res.errs.map(n => `<br><span class="msg-err">ERROR ${esc(n)}</span>`).join(''), [['OK', 'gold', 1]]);
    }); };
}
